# Tarefas automáticas do Estoque Pro (substituem os crons do Emergent).
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   APP_URL             https://estoquevendaspro.com.br
#   WEBHOOK_CRON_SECRET o mesmo valor do Render
name: Tarefas automaticas

on:
  schedule:
    # Fora da hora cheia: o GitHub atrasa ou pula agendamentos em :00 quando está sobrecarregado.
    - cron: "41 8 * * *"   # 05:41 em Brasília — backup diário
    - cron: "41 11 * * *"  # 08:41 em Brasília — repescagem: só faz backup se o das 05:41 não aconteceu
    - cron: "7 15 * * *"   # 12:07 em Brasília — avisos de vencimento
  workflow_dispatch:
    inputs:
      tarefa:
        description: "backup, backup-se-faltar ou avisos"
        required: true
        default: backup

permissions:
  contents: read

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Escolher tarefa
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            T="${{ github.event.inputs.tarefa }}"
          elif [ "${{ github.event.schedule }}" = "41 8 * * *" ]; then
            T=backup
          elif [ "${{ github.event.schedule }}" = "41 11 * * *" ]; then
            T=backup-se-faltar
          else
            T=avisos
          fi
          case "$T" in
            backup) echo "path=/api/cron/backup" >> "$GITHUB_OUTPUT" ;;
            backup-se-faltar) echo "path=/api/cron/backup?if_missing=1" >> "$GITHUB_OUTPUT" ;;
            avisos) echo "path=/api/cron/subscription-reminders" >> "$GITHUB_OUTPUT" ;;
            *) echo "tarefa inválida"; exit 1 ;;
          esac
      - name: Acordar o servidor
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null --max-time 60 "$APP_URL/api/public/plans" && exit 0 || sleep 20
          done
          echo "servidor não respondeu"; exit 1
      - name: Chamar a tarefa
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.WEBHOOK_CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST \
            -H "Authorization: Bearer $SECRET" \
            "$APP_URL${{ steps.t.outputs.path }}"
